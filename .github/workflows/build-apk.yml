name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK components
        uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          key: android-sdk-36-36.0.0

      - name: Accept Android SDK licenses & install components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Set up Rust & cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk || true

      - name: Build Rust native core (sboard-core)
        run: |
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "Installing Android NDK..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "Using Android NDK at: $NDK_DIR"
          export ANDROID_NDK_HOME="$NDK_DIR"
          mkdir -p app/src/main/jniLibs
          cd sboard-core
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release
          cd ..
          ls -la app/src/main/jniLibs/* || true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"
            chmod 600 "$RUNNER_TEMP/signing/release.keystore"
          fi

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/signing/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache --parallel --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sboard-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check for Release
        id: check_release
        run: |
          if [[ "${{ github.event.head_commit.message }}" == Release\ v* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            TAG=$(echo "${{ github.event.head_commit.message }}" | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+' | head -n 1)
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        if: steps.check_release.outputs.is_release == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          TAG_NAME: ${{ steps.check_release.outputs.tag }}
        run: python3 .github/scripts/generate_release_notes.py

      - name: Publish tagged release
        if: steps.check_release.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.tag }}
          name: Sboard ${{ steps.check_release.outputs.tag }}
          body_path: release_notes.md
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: false
